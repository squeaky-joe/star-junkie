services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - botdata:/data
      # Edit the .md files on the host, no rebuild needed. Writable because the bot keeps ships.json (its ship cache) here.
      - ./content:/content

volumes:
  botdata:
