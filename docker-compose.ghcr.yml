# Run the published image, no build needed:
#   1. Put DISCORD_TOKEN=... in a .env file next to this one (optional: GUILD_ID=...)
#   2. docker compose -f docker-compose.ghcr.yml up -d
services:
  bot:
    image: ghcr.io/squeaky-joe/star-junkie:latest # or pin a release, e.g. :2026.11
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Put DISCORD_TOKEN=... in a .env file next to this one}
      GUILD_ID: ${GUILD_ID:-}
    volumes:
      - botdata:/data # the database; keep it, it holds applications, events and mod logs
      # Optional: customize /history, /charter, /manifesto and /rules by mounting your own copies.
      # Start from the files in this repo's content/ folder (the bot also caches ship data there).
      # - ./content:/content

volumes:
  botdata:
